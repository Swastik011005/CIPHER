name: CI

# Runs on every push to main, develop and feature branches, and on pull requests into main and develop.
# The same commands run locally with `python scripts/tasks.py verify`.
on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and scenario checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies (runtime and test tools)
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -o addopts= -q -p no:cacheprovider
      - name: Scenario checks (S1 to S7, shipped rules)
        run: python scripts/run_scenario_checks.py

  runtime-install:
    name: Server starts with the runtime dependencies only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install the runtime set only
        run: python -m pip install -r backend/requirements.txt
      - name: Build the application and check that no test tool is installed
        working-directory: backend
        run: |
          python -c "from netsec.api.app_factory import create_app; app = create_app(); print('application built:', app.title)"
          python -c "import importlib.util as u, sys; bad = [m for m in ('pytest', 'httpx', 'scapy', 'yaml') if u.find_spec(m)]; sys.exit('unexpected test tools installed: %s' % bad if bad else 0)"

      - name: Start in production mode and probe it
        working-directory: backend
        env:
          NETSEC_ENV: production
          NETSEC_CORS_ORIGINS: https://netsec-3d.onrender.com
          NETSEC_LOG_LEVEL: warning
          PORT: "18080"
        run: |
          python app.py &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/api/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/api/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/docs)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:18080/api/rules/detectors)" = 403
          curl -s -D - -o /dev/null -H 'Origin: https://netsec-3d.onrender.com' http://127.0.0.1:18080/api/health | grep -qi 'access-control-allow-origin: https://netsec-3d.onrender.com'

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Frontend tests (Vitest)
        run: npx vitest run
      - name: Production build
        run: npm run build
